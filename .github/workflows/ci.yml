name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Postgres + Redis
        run: docker compose -f infra/docker-compose.yml up -d

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker exec aegis-postgres pg_isready -U aegis && break
            sleep 2
          done

      - name: Build workspaces
        env:
          DATABASE_URL: postgres://aegis:aegis_dev_password@127.0.0.1:5432/aegis
        run: npm run build

      - name: Unit tests (vitest)
        run: npm test

      - name: Start orchestrator + compile
        run: |
          export DATABASE_URL=postgres://aegis:aegis_dev_password@127.0.0.1:5432/aegis
          export POSTGRES_URL=$DATABASE_URL
          node packages/orchestrator/src/index.js > /tmp/orch.log 2>&1 &
          node packages/compile/src/index.js > /tmp/compile.log 2>&1 &
          for i in $(seq 1 30); do
            o=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/ || true)
            c=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4100/ || true)
            if [ "$o" != "000" ] && [ "$c" != "000" ]; then echo ready; break; fi
            sleep 2
          done

      - name: E2E smoke (orchestrator + compile)
        run: node infra/e2e-test.mjs

      - name: E2E relay loop (embed -> relay -> confirmed)
        run: node infra/relay-e2e.mjs

      - name: Upload logs on failure
        if: failure()
        run: |
          echo "--- orchestrator ---"; tail -100 /tmp/orch.log || true
          echo "--- compile ---"; tail -100 /tmp/compile.log || true